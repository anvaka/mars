<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Mars elevation tiles: before and after</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; font-family: 'Avenir', Helvetica, Arial, sans-serif; color: #2c3e50; }
      /* ids, because maplibre sets its own position on the map container */
      #before, #after { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #08080c; }
      #divider { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; background: #ff4081; cursor: ew-resize; z-index: 3; }
      #divider::after { content: '↔'; position: absolute; top: 50%; left: -15px; width: 32px; height: 32px; line-height: 32px;
        margin-top: -16px; text-align: center; border-radius: 16px; background: #ff4081; color: white; }
      .side { position: absolute; bottom: 12px; z-index: 2; padding: 4px 10px; background: white; font-size: 14px; pointer-events: none; }
      #before-name { left: 12px; }
      #after-name { right: 12px; }
      #panel { position: absolute; top: 0; left: 0; z-index: 4; padding: 8px 12px; background: white; font-size: 14px;
        box-shadow: 0 0 20px rgba(0,0,0,.3); }
      #panel label { margin-right: 12px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="before" class="map"></div>
    <div id="after" class="map"></div>
    <div id="divider"></div>
    <div id="before-name" class="side">Before: MapBox, 8 bit, zoom 0-8</div>
    <div id="after-name" class="side">After: R2, 16 bit, zoom 0-9</div>
    <div id="panel">
      <label><input type="radio" name="mode" value="shade" checked> Shaded relief</label>
      <label><input type="radio" name="mode" value="color"> Colors</label>
      <label><input type="radio" name="mode" value="both"> Both</label>
    </div>
    <script type="module" src="./compare.js"></script>
  </body>
</html>
